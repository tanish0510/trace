name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Verify no uncommitted build artifacts
        run: |
          if [ -d "dist" ]; then
            echo "Warning: dist/ should not be committed"
          fi

      - name: Check TypeScript strict mode
        run: npx tsc --noEmit
